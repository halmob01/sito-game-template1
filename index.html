<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: la mappa domina. Su schermo largo mappa e misure a sinistra, scene e ordini a destra. Su telefono: barra, mappa, misure, scena.
   Look: pagina bianca, rosso araldico per azioni e pericolo, inchiostro per il testo. Un solo tema deliberato. */
:root {
  --white: #ffffff; --ink: #1c1416; --red: #c8102e; --red-dark: #96091f; --red-pale: #fdeaed;
  --paper: #fbf7f2; --line: #e9dfe0; --mute: #6c5f63; --soft: #f4efec;
  --display: 'Alfa Slab One', 'Rockwell', Georgia, serif; --ui: 'Public Sans', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--white); color: var(--ink); font-family: var(--ui); font-size: 1rem; line-height: 1.45;
  padding-inline: 1rem; padding-block: .8rem 3rem; }
button, input, textarea { font: inherit; color: inherit; }
.app { max-width: 70rem; margin-inline: auto; display: flex; flex-direction: column; gap: .8rem; }

.bar { display: flex; justify-content: space-between; align-items: center; gap: .8rem; flex-wrap: wrap; border-bottom: 3px solid var(--red); padding-bottom: .5rem; }
.sub { font-weight: 800; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
.bar-r { display: flex; align-items: center; gap: .6rem; }
.score { text-align: end; line-height: 1; }
.score b { font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.score small { display: block; font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.pill { font-weight: 700; font-size: .85rem; border: 2px solid var(--ink); background: var(--white); padding: .35rem .8rem; cursor: pointer; }
.pill:hover { background: var(--ink); color: var(--white); }

.stage { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(19rem, 1fr); gap: 1rem; align-items: start; }
.left { display: flex; flex-direction: column; gap: .7rem; min-width: 0; }
@media (max-width: 52rem) { .stage { display: flex; flex-direction: column; align-items: stretch; } }

.mapwrap { position: relative; border: 3px solid var(--ink); background: var(--paper); line-height: 0; }
#map { width: 100%; display: block; touch-action: manipulation; cursor: pointer; }
.chapter-tag { position: absolute; left: .6rem; top: .6rem; background: var(--red); color: var(--white); font-weight: 800; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; padding: .25rem .6rem; line-height: 1.2; pointer-events: none; }
.turn-tag { position: absolute; right: .6rem; bottom: .6rem; background: var(--white); border: 2px solid var(--ink); font-weight: 800; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; padding: .2rem .55rem; line-height: 1.2; pointer-events: none; }
.progress { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.progress div { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.progress i { height: 7px; background: var(--line); display: block; }
.progress i.done { background: var(--ink); } .progress i.now { background: var(--red); }

.hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
.st { border: 2px solid var(--ink); padding: .4rem .55rem .5rem; background: var(--white); min-width: 0; }
.st-h { display: flex; justify-content: space-between; align-items: baseline; gap: .3rem; font-weight: 800; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
.st-h b { font-family: var(--display); font-size: 1.15rem; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.st .bar2 { height: 7px; background: var(--soft); margin-top: .3rem; }
.st .bar2 i { display: block; height: 100%; background: var(--ink); transition: width .5s; }
.st.low { border-color: var(--red); } .st.low .bar2 i { background: var(--red); } .st.low b { color: var(--red); }
.st.up b { animation: up .9s; } .st.down b { animation: down .9s; }
@keyframes up { 0% { transform: scale(1.35); } 100% { transform: none; } }
@keyframes down { 0% { transform: scale(1.35); color: var(--red); } 100% { transform: none; } }
.st.off { display: none; }
@media (max-width: 34rem) { .hud { grid-template-columns: 1fr 1fr; } }
@media (max-width: 34rem) { .panel { box-shadow: 4px 4px 0 var(--red); } }

.panel { border: 3px solid var(--ink); background: var(--white); padding: clamp(1rem, 3vw, 1.5rem); display: flex; flex-direction: column; gap: .9rem; min-width: 0; animation: in .25s ease-out; box-shadow: 6px 6px 0 var(--red); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .panel, .st.up b, .st.down b { animation: none; } .st .bar2 i { transition: none; } }
.eyebrow { font-weight: 800; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
h1, h2 { font-family: var(--display); font-weight: 400; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; } h2 { font-size: 1.5rem; }
h3 { font-size: .95rem; margin: 0; font-weight: 800; }
p { margin: 0; max-width: 38rem; }
.prose { display: flex; flex-direction: column; gap: .6rem; font-size: 1.05rem; }

.quote { border-inline-start: 4px solid var(--red); padding-inline-start: .8rem; font-weight: 700; max-width: 38rem; }

.btn { font-weight: 800; font-size: 1rem; padding: .7rem 1.2rem; background: var(--red); color: var(--white); border: 2px solid var(--red); cursor: pointer; align-self: flex-start; }

.orders { display: flex; flex-direction: column; gap: .4rem; }
.order { display: flex; justify-content: space-between; align-items: center; gap: .6rem; text-align: start; border: 2px solid var(--ink); background: var(--white); padding: .5rem .7rem; cursor: pointer; font-weight: 700; font-size: .95rem; }
.order:hover, .order.sel { background: var(--red-pale); border-color: var(--red); }
.order .chips { justify-content: flex-end; flex-shrink: 0; }
.sel-card { border: 3px solid var(--red); padding: .8rem; display: flex; flex-direction: column; gap: .5rem; background: var(--red-pale); }

.field { display: flex; flex-direction: column; gap: .3rem; max-width: 20rem; }
.field label { font-weight: 800; font-size: .85rem; }
.field input { background: var(--white); border: 2px solid var(--ink); padding: .6rem .7rem; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .6rem; }
.rules div { border-top: 3px solid var(--red); padding-top: .35rem; font-size: .92rem; line-height: 1.3; }
.rules b { display: block; }

.big { font-family: var(--display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--red); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.split div { border: 2px solid var(--ink); padding: .5rem .7rem; }
.split b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; display: block; }
.split small { font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
textarea, .linkbox { width: 100%; background: var(--soft); border: 2px solid var(--ink); padding: .6rem; font-size: .85rem; word-break: break-all; }
textarea { min-height: 6rem; resize: vertical; }
.linkbox { user-select: all; font-family: ui-monospace, Menlo, monospace; }

.board { display: flex; flex-direction: column; border: 2px solid var(--ink); }
.brow { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: .6rem; align-items: center; padding: .5rem .7rem; border-bottom: 1px solid var(--line); }
.brow:last-child { border: 0; }
.brow.first { background: var(--red); color: var(--white); }
.brow.first small { color: #ffd9df; }
.pos { font-family: var(--display); font-size: 1.2rem; text-align: center; }
.brow b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow small { color: var(--mute); font-weight: 600; font-size: .78rem; }
.pts { font-family: var(--display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }

#winner { position: fixed; inset: 0; background: var(--red); color: var(--white); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center; padding: 1.5rem; overflow: hidden; }
#winner[hidden] { display: none; }
#winner .w1 { font-weight: 800; letter-spacing: .3em; text-transform: uppercase; }
#winner .w2 { font-family: var(--display); font-size: clamp(2.4rem, 11vw, 6rem); line-height: 1; overflow-wrap: anywhere; }

@keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }

/* tutorial, eventi, ordini */
.pill[disabled] { opacity: .35; cursor: default; } .pill[disabled]:hover { background: var(--white); color: inherit; }
.pill[hidden] { display: none; }
@media (max-width: 34rem) { .pill { padding: .35rem .6rem; font-size: .8rem; } .bar-r { gap: .4rem; } }
.hl { outline: 4px solid var(--red); outline-offset: 3px; animation: hlp 1.1s ease-in-out infinite; }
@keyframes hlp { 50% { outline-color: rgba(200,16,46,.15); } }

.coach { background: var(--ink); color: var(--white); padding: .7rem .9rem; display: flex; flex-direction: column; gap: .25rem; font-size: .95rem; }
.coach small { font-weight: 800; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: #ffb3bf; }
.badge { align-self: flex-start; display: inline-block; font-weight: 800; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; padding: .18rem .55rem; background: var(--ink); color: var(--white); line-height: 1.3; }
.badge.Minaccia, .badge.Crisi { background: var(--red); }
.note .badge { margin-bottom: .1rem; }
.tag { display: block; font-weight: 800; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--red); margin-bottom: .1rem; }
.stakes { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.stakes .lbl { font-weight: 800; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.stake { border: 2px solid var(--ink); padding: .1rem .5rem; font-weight: 700; font-size: .85rem; background: var(--white); }
.stake b { font-family: var(--display); font-weight: 400; margin-inline-start: .35rem; }
.stake.low { border-color: var(--red); color: var(--red); }
.ask { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-top: .2rem; }
.you small { font-weight: 800; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); display: block; margin-bottom: .15rem; }

.cg { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }

.whyline { font-weight: 700; color: var(--red-dark); }
.grp { display: flex; flex-direction: column; gap: .35rem; }
.gh { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-top: .3rem; }

.order { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: .25rem; }
.order .chips { justify-content: flex-start; }
.order.reco { border-color: var(--red); }
.o-t { font-weight: 800; }
.o-why { font-size: .82rem; font-weight: 600; color: var(--red-dark); }

/* lingua araba: scrittura da destra a sinistra, la mappa resta com'e' */
.app[lang="ar"] { --display: 'Cairo', 'Noto Sans Arabic', system-ui, sans-serif; --ui: 'Cairo', 'Noto Sans Arabic', system-ui, sans-serif; font-family: var(--ui); }

const LABEL = { c: 'Granaio', s: 'Sicurezza', p: 'Contadini', r: 'Favore del re', fort: 'Difese', terre: 'Campi', vass: 'Fedeli', chiesa: 'Pieve', guardie: 'Guardie' };

"Pali di legno intorno alla villa. Tiene lontane le bande.": "أوتاد خشبية حول الضيعة. تُبعد العصابات.",
"Mandare degli esploratori": "إرسال كشّافة",
"Due uomini controllano strade e boschi. Scopri quanto è forte la minaccia in arrivo.": "رجلان يفحصان الطرق والغابات. تكتشف مدى قوة التهديد القادم.",
"Scopri la minaccia": "اكتشف التهديد",
"Studiare con i monaci": "الدراسة مع الرهبان",
"I monaci copiano e leggono libri. Ti aiutano a ripassare la lezione.": "الرهبان ينسخون الكتب ويقرؤونها. يساعدونك على مراجعة الدرس.",
"Aiuto per la domanda": "مساعدة في السؤال",
"Ricostruire il villaggio": "إعادة بناء القرية",
"Case, stalle e recinti danneggiati tornano in piedi.": "البيوت والإسطبلات والأسوار المتضررة تعود إلى الوقوف.",
"Cancella i danni": "إصلاح الأضرار",
"Si sta bene: la gente è più serena (+2).": "الحال جيدة: الناس أكثر هدوءًا (⁦+2⁩).",
"I contadini abbandonano i campi. Senza di loro non c'è raccolto né difesa.": "يترك الفلاحون الحقول. وبدونهم لا يوجد حصاد ولا دفاع.",
"I contadini mormorano. Se continua, se ne vanno.": "الفلاحون يتذمرون. وإن استمر الأمر فسيرحلون.",
"Fame: i contadini sono preoccupati (−4).": "الجوع: الفلاحون قلقون (⁦−4⁩).",
"Razionare il grano": "تقنين القمح",
"Porzioni più piccole per tutti: il granaio dura di più.": "حصص أصغر للجميع: يدوم مخزن الحبوب أطول.",
"Paura: nessuno si sente al sicuro (−4).": "الخوف: لا أحد يشعر بالأمان (⁦−4⁩).",
"Il capo delle guardie dice che la difesa è debolissima.": "يقول قائد الحراس إن الدفاع ضعيف جدًا.",
"Castello di pietra": "قلعة من الحجر",
"Mura, torri e un mastio. Il castello vero e proprio.": "أسوار وأبراج وحصن مركزي. القلعة الحقيقية.",
"Il tuo fattore avvisa: il granaio è quasi vuoto.": "ينبّهك مدير ضيعتك: مخزن الحبوب شبه فارغ.",
"Carestia! Il granaio è vuoto. Alcune famiglie fuggono e le altre soffrono la fame.": "مجاعة! مخزن الحبوب فارغ. بعض العائلات تهرب والباقون يعانون من الجوع.",
"Banditi nella nebbia": "قطّاع طرق في الضباب",
"Un pastore dice di aver visto fuochi nella nebbia, oltre il fiume. Forse una banda armata.": "يقول راعٍ إنه رأى نيرانًا في الضباب خلف النهر. ربما عصابة مسلحة.",
"Sono cinque uomini affamati, senza capo. Con Sicurezza 45 o più, non osano entrare.": "هم خمسة رجال جائعون بلا قائد. إذا كان الأمان 45 أو أكثر فلن يجرؤوا على الدخول.",
"Una banda armata si avvicina alla villa. Non sono soldati: sono uomini affamati, rimasti senza padrone. Vogliono il grano.": "عصابة مسلحة تقترب من الضيعة. ليسوا جنودًا: هم رجال جائعون بقوا بلا سيد. يريدون القمح.",
"Forza": "قوة",
"Resistere con i tuoi uomini": "أن تقاوم برجالك",
"I tuoi uomini sono pronti e numerosi. I banditi rinunciano e scappano. La gente è fiera di te.": "رجالك مستعدون وكثيرون. يتخلى قطّاع الطرق ويهربون. والناس فخورون بك.",
"Dare loro del grano": "أن تعطيهم قمحًا",
"Se ne vanno. Ma ora sanno che sei debole, e torneranno.": "يرحلون. لكنهم الآن يعرفون أنك ضعيف، وسيعودون.",
"Accordo": "اتفاق",
"Offrire lavoro e un posto nella villa": "أن تعرض عليهم عملًا ومكانًا في الضيعة",
"Alcuni restano e diventano tuoi uomini. Un patto nuovo: ti servono e ti proteggono. Un legame personale, come quelli dei rapporti feudali.": "بعضهم يبقى ويصبح من رجالك. اتفاق جديد: يخدمونك ويحمونك. رابطة شخصية، كالتي في العلاقات الإقطاعية.",
"I tuoi uomini sono pochi e impreparati. I banditi portano via grano e bestiame.": "رجالك قليلون وغير مستعدين. يأخذ قطّاع الطرق القمح والماشية.",
"Le famiglie chiedono rifugio": "العائلات تطلب المأوى",
"Alcune famiglie dei villaggi vicini si stanno mettendo in cammino: cercano un posto sicuro.": "بعض العائلات من القرى المجاورة تتحرك نحوك: تبحث عن مكان آمن.",
"Le bande sono sempre più frequenti. Alcune famiglie dei villaggi vicini bussano alla tua porta. Vogliono vivere vicino alla tua casa e, in cambio, lavoreranno le tue terre.": "العصابات تزداد كل يوم. بعض العائلات من القرى المجاورة تطرق بابك. تريد العيش قرب بيتك، وفي المقابل ستعمل في أراضيك.",
"Accoglierle e dare protezione": "أن تستقبلهم وتمنحهم الحماية",
"Ecco un patto: protezione in cambio di lavoro e fedeltà. Hai più braccia e più bocche da sfamare.": "هذا اتفاق: حماية مقابل عمل وولاء. لديك أيدٍ أكثر وأفواه أكثر لتُطعمها.",
"Patto": "عهد",
"Accoglierle solo se giurano fedeltà": "أن تستقبلهم فقط إذا أقسموا على الولاء",
"Giurano davanti a tutti. Non è una legge dello Stato, è una promessa tra persone.": "يقسمون أمام الجميع. هذا ليس قانون دولة، بل وعد بين أشخاص.",
"Rifiutare: non hai cibo per tutti": "أن ترفض: ليس عندك طعام للجميع",
"Se ne vanno. Il granaio è salvo, ma la gente del villaggio ti giudica duramente.": "يرحلون. مخزن الحبوب سليم، لكن أهل القرية يحكمون عليك بقسوة.",
"La banda arriva": "العصابة تصل",
"Le sentinelle sentono un corno nella nebbia: una banda più grande si avvicina. Contano le Difese e la Sicurezza.": "يسمع الحراس بوقًا في الضباب: عصابة أكبر تقترب. تهمّ الدفاعات والأمان.",
"Sono più di venti uomini. Con una palizzata (Difese 1) e Sicurezza 35 o più, reggi. Con meno, perdi parte del raccolto. Senza difese, ti saccheggiano.": "هم أكثر من عشرين رجلًا. بسياج خشبي (الدفاعات 1) وأمان 35 أو أكثر تصمد. وبأقل من ذلك تخسر جزءًا من الحصاد. وبلا دفاعات ينهبونك.",
"All'alba senti suonare un corno. La banda è qui: decine di uomini armati sulla strada della villa.": "عند الفجر تسمع صوت بوق. العصابة هنا: عشرات الرجال المسلحين على طريق الضيعة.",
"Difenderti dietro le difese": "أن تدافع خلف دفاعاتك",
"Senza mura puoi fare poco. La banda entra e saccheggia.": "بلا أسوار لا تستطيع فعل الكثير. تدخل العصابة وتنهب.",
"Fuga": "هروب",
"Scappare con la famiglia e tornare dopo": "أن تهرب مع عائلتك وتعود لاحقًا",
"Ti salvi, ma abbandoni i contadini. Non te lo perdoneranno facilmente.": "تنجو، لكنك تتخلى عن الفلاحين. ولن يغفروا لك بسهولة.",
"Trattare con il capo della banda": "أن تتفاوض مع زعيم العصابة",
"Paghi un tributo per essere lasciato in pace. Non è molto diverso da una tassa, ma va a vantaggio di chi ti minaccia.": "تدفع إتاوة ليتركوك بسلام. وهي لا تختلف كثيرًا عن الضريبة، لكنها تفيد من يهددك.",
"Le difese reggono e i tuoi uomini sono pronti. La banda cerca un altro bersaglio. I contadini capiscono perché servono le mura.": "الدفاعات صامدة ورجالك مستعدون. تبحث العصابة عن هدف آخر. ويفهم الفلاحون لماذا نحتاج إلى الأسوار.",
"Le difese reggono, ma i tuoi uomini sono pochi. Perdi parte del raccolto.": "الدفاعات صامدة، لكن رجالك قليلون. تخسر جزءًا من الحصاد.",
"Soldati stranieri alla porta": "جنود أجانب عند الباب",
"Si dice che una colonna di soldati stranieri stia attraversando la zona. Avranno fame.": "يقال إن رتلًا من الجنود الأجانب يعبر المنطقة. سيكونون جائعين.",
"Da anni in Italia si combatte. Oggi una colonna di soldati stranieri si ferma alla tua villa: hanno fame e pretendono grano e cavalli. Per i tuoi contadini non conta chi vince la guerra. Conta cosa resta dopo il passaggio dei soldati.": "منذ سنوات والقتال دائر في إيطاليا. اليوم يتوقف رتل من الجنود الأجانب عند ضيعتك: هم جائعون ويطالبون بالقمح والخيول. بالنسبة لفلاحيك لا يهم من يربح الحرب. المهم ما يبقى بعد مرور الجنود.",
"Dare quello che chiedono": "أن تعطيهم ما يطلبون",
"I soldati prendono grano e cavalli e se ne vanno. Il granaio è mezzo vuoto, ma nessuno è stato ferito.": "يأخذ الجنود القمح والخيول ويرحلون. مخزن الحبوب نصف فارغ، لكن لم يُصَب أحد.",
"Inganno": "خداع",
"Nascondere parte delle scorte": "أن تخبّئ جزءًا من المؤن",
"I contadini tengono il segreto: nessuno ti tradisce. I soldati trovano poco e se ne vanno.": "يحفظ الفلاحون السر: لا أحد يخونك. يجد الجنود القليل ويرحلون.",
"Cacciarli con le armi": "أن تطردهم بالسلاح",
"Sono più forti di te. Ti prendono quello che vogliono e bruciano parte del villaggio.": "هم أقوى منك. يأخذون ما يريدون ويحرقون جزءًا من القرية.",
"Qualcuno racconta ai soldati dove sono le scorte. Ti portano via tutto e puniscono il villaggio.": "يخبر أحدهم الجنود بمكان المؤن. يأخذون كل شيء ويعاقبون القرية.",
"I tuoi uomini sono tanti e decisi. I soldati stranieri cercano un'altra villa meno difesa.": "رجالك كثيرون وحازمون. يبحث الجنود الأجانب عن ضيعة أخرى أقل حماية.",
"Inverno di fame": "شتاء الجوع",
"La guerra ha lasciato molti campi senza semina. L'inverno sarà duro e il granaio è la cosa che conta.": "تركت الحرب حقولًا كثيرة بلا زرع. سيكون الشتاء قاسيًا ومخزن الحبوب هو الأهم.",
"Per colpa della guerra molti campi non sono stati seminati. Dopo mesi di raccolti poveri le scorte si assottigliano e arrivano voci di malattie nei villaggi vicini. Le famiglie guardano il granaio.": "بسبب الحرب لم تُزرع حقول كثيرة. وبعد أشهر من الحصاد الضعيف تتناقص المؤن وتصل أخبار عن أمراض في القرى المجاورة. والعائلات تنظر إلى مخزن الحبوب.",
"Prudenza": "حكمة",
"Dividere il grano in porzioni piccole per tutti": "أن تقسّم القمح إلى حصص صغيرة للجميع",
"Il grano basta fino a primavera. Si mangia poco, ma nessuno muore di fame.": "يكفي القمح حتى الربيع. نأكل قليلًا، لكن لا أحد يموت جوعًا.",
"Dare grano ai malati e ai più poveri": "أن تعطي القمح للمرضى وللأكثر فقرًا",
"Salvi molte persone, ma il granaio si svuota in fretta. La gente non lo dimenticherà.": "تنقذ أشخاصًا كثيرين، لكن مخزن الحبوب يفرغ بسرعة. ولن ينسى الناس ذلك.",
"Durezza": "قسوة",
"Mandare via le bocche inutili": "أن تطرد الأفواه الزائدة",
"Il granaio regge, ma la gente non te lo perdona. Rimane la paura.": "مخزن الحبوب يصمد، لكن الناس لا يغفرون لك. ويبقى الخوف.",
"Il grano non basta nemmeno così. Molti si ammalano e alcune famiglie se ne vanno.": "لا يكفي القمح حتى هكذا. يمرض كثيرون وترحل بعض العائلات.",
"Arrivano i Longobardi": "وصول اللومبارديين",
"Un messo a cavallo sta arrivando da Pavia: parla a nome di un re.": "رسول على حصان في طريقه إليك من بافيا: يتكلم باسم ملك.",
"Un messo a cavallo arriva alla tua porta. Il re dei Longobardi, che governa da Pavia, vuole sapere da che parte stai. Per la prima volta dopo molto tempo qualcuno ti parla a nome di un potere più grande.": "يصل إلى بابك رسول على حصان. ملك اللومبارديين، الذي يحكم من بافيا، يريد أن يعرف في أي صف أنت. لأول مرة منذ زمن طويل يكلّمك أحد باسم سلطة أكبر.",
"Fedeltà": "ولاء",
"Giurare fedeltà al re": "أن تقسم الولاء للملك",
"Il re ti riconosce. Tu gli prometti aiuto, lui ti lascia la terra e il diritto di governarla.": "يعترف بك الملك. وأنت تعده بالمساعدة، وهو يترك لك الأرض وحق حكمها.",
"Attesa": "انتظار",
"Prendere tempo": "أن تأخذ وقتًا",
"Non dici né sì né no. Il messo riparte senza risposta.": "لا تقول نعم ولا لا. يرحل الرسول بلا جواب.",
"Indipendenza": "استقلال",
"Rifiutare e restare indipendente": "أن ترفض وتبقى مستقلًا",
"Sei libero, per ora. Ma il re ricorda chi ha detto no.": "أنت حر، في الوقت الحالي. لكن الملك يتذكر من قال لا.",
"Tenere il tribunale": "عقد المحكمة",
"Giudichi una lite tra famiglie in nome del re. Si vede che c'è ancora una legge.": "تحكم في خلاف بين عائلتين باسم الملك. يرى الناس أن هناك قانونًا ما زال موجودًا.",
"Doni al re": "هدايا للملك",
"Mandare doni al re": "أن ترسل هدايا للملك",
"Un messo porta grano e regali. Il re si ricorda di te.": "يحمل رسول قمحًا وهدايا. يتذكرك الملك.",
"Il re è lontano e si dimentica di te (−3).": "الملك بعيد وينساك (⁦−3⁩).",
"Il re ti toglie la sua fiducia e ti manda un avvertimento armato.": "يسحب الملك ثقته منك ويرسل إليك تحذيرًا مسلحًا.",
"Il re non ha tue notizie da troppo tempo.": "لم يصل الملك منك خبر منذ زمن طويل.",
"Il tributo e il titolo": "الجزية واللقب",
"Il messo del re tornerà a chiedere un tributo in grano. Contano il granaio e il Favore del re.": "سيعود رسول الملك ليطلب جزية من القمح. يهمّ مخزن الحبوب ورضا الملك.",
"Il messo del re arriva a raccogliere un tributo in grano. Poi aggiunge: «Il re non può venire qui ogni mese. Per questo ti affida il governo di questa zona. Giudichi, difendi e riscuoti, in suo nome».": "يصل رسول الملك لجمع جزية من القمح. ثم يضيف: «لا يستطيع الملك أن يأتي إلى هنا كل شهر. لذلك يكلّفك بحكم هذه المنطقة. تحكم وتدافع وتجمع الضرائب باسمه».",
"Obbedienza": "طاعة",
"Accettare il titolo e pagare tutto il tributo": "أن تقبل اللقب وتدفع الجزية كاملة",
"Hai in mano poteri pubblici, ma sei un uomo del re. Il potere è appaltato: il re comanda per mezzo tuo.": "صارت بيدك سلطات عامة، لكنك رجل الملك. السلطة مُلتزَمة: الملك يأمر بواسطتك.",
"Trattativa": "مفاوضة",
"Accettare il titolo e pagare meno": "أن تقبل اللقب وتدفع أقل",
"Il messo si lamenta, ma accetta. Il re ha bisogno di te più di quanto tu ne abbia di lui.": "يشتكي الرسول، لكنه يقبل. الملك يحتاج إليك أكثر مما تحتاج أنت إليه.",
"Rifiutare il titolo": "أن ترفض اللقب",
"Resti libero, ma senza l'appoggio di nessuno.": "تبقى حرًا، لكن بلا سند من أحد.",
"Vassallo": "تابع",
"Affidare un villaggio a un fedele": "أن تعهد بقرية إلى تابع",
"Gli dai terra e poteri, lui ti giura fedeltà e ti difende. Governi meno da vicino.": "تعطيه أرضًا وصلاحيات، فيقسم لك بالولاء ويدافع عنك. تحكم عن قرب أقل.",
"Arrivano i monaci": "وصول الرهبان",
"Una piccola processione di monaci cammina verso le tue terre.": "موكب صغير من الرهبان يسير نحو أراضيك.",
"Un gruppo di monaci chiede di fondare un monastero sulle tue terre. Copiano libri, pregano, curano i malati e insegnano a leggere.": "مجموعة من الرهبان تطلب تأسيس دير في أراضيك. ينسخون الكتب ويصلّون ويعالجون المرضى ويعلّمون القراءة.",
"Dono": "هبة",
"Donare loro un terreno": "أن تهبهم قطعة أرض",
"I monaci ti benedicono. La Chiesa ha una rete stabile di monasteri: dove lo Stato è sparito, loro restano.": "يباركك الرهبان. للكنيسة شبكة ثابتة من الأديرة: حيث اختفت الدولة، بقوا هم.",
"Affitto": "إيجار",
"Accettare solo in cambio di un affitto": "أن تقبل فقط مقابل إيجار",
"I monaci pagano un affitto in grano e si mettono al lavoro.": "يدفع الرهبان إيجارًا من القمح ويبدؤون العمل.",
"Rifiutare": "أن ترفض",
"Vanno a chiedere ospitalità altrove. I contadini ne sono dispiaciuti.": "يذهبون لطلب الضيافة في مكان آخر. ويأسف الفلاحون لذلك.",
"Campanile": "برج الجرس",
"Ingrandire il monastero": "توسيع الدير",
"Preti e monaci curano, insegnano e copiano libri.": "القساوسة والرهبان يعالجون ويعلّمون وينسخون الكتب.",
"Fondare una pieve": "تأسيس كنيسة رعوية",
"Il vicino prepotente": "الجار المتعجرف",
"Un signore vicino si è fatto un castello e manda messi minacciosi. Conta la Sicurezza, e il Favore del re se vuoi chiedere aiuto.": "سيد مجاور بنى قلعة ويرسل رسلًا مهددين. يهمّ الأمان، ورضا الملك إذا أردت طلب المساعدة.",
"Il suo castello è ancora mezzo finito. Con Sicurezza 50 o più lo respingi. Il re ti aiuta solo se hai Favore del re 50 o più.": "قلعته ما زالت نصف مكتملة. بأمان 50 أو أكثر تردّه. والملك يساعدك فقط إذا كان رضا الملك 50 أو أكثر.",
"Un signore vicino si è fatto un castello e pretende un tributo dai tuoi contadini. Dice che altrimenti non li proteggerà.": "سيد مجاور بنى قلعة ويطالب فلاحيك بجزية. ويقول إنه لن يحميهم إلا بذلك.",
"Pagarlo": "أن تدفع له",
"Paghi, ma ora i tuoi contadini sanno che non sei tu a proteggerli.": "تدفع، لكن فلاحيك يعرفون الآن أنك لست من يحميهم.",
"Combatterlo": "أن تقاتله",
"I tuoi uomini sono pronti e il suo castello è mal difeso. Lo costringi a ritirarsi.": "رجالك مستعدون وقلعته ضعيفة الدفاع. تجبره على التراجع.",
"Chiedere al re di intervenire": "أن تطلب من الملك أن يتدخل",
"Il re ti ascolta e manda un messo che ti dà ragione. Ma ora gli devi un favore.": "يسمعك الملك ويرسل رسولًا ينصفك. لكنك الآن مدين له بخدمة.",
"I tuoi uomini non sono abbastanza. Perdi la battaglia e parte del raccolto.": "رجالك لا يكفون. تخسر المعركة وجزءًا من الحصاد.",
"Il re non ti risponde: non gli sei abbastanza vicino. Sei solo.": "لا يرد عليك الملك: لست قريبًا منه بما يكفي. أنت وحدك.",
"Carlo Magno": "شارلمان",
"Si dice che l'imperatore mandi un suo messo a controllare i territori. Fare bella figura conta: Difese e Favore del re.": "يقال إن الإمبراطور يرسل مبعوثًا لتفقد الأراضي. حسن الظهور مهم: الدفاعات ورضا الملك.",
"Nell'anno 800 il papa incorona Carlo Magno imperatore. Un messo dell'imperatore, il missus dominicus, viene a visitare il tuo territorio e ti fa domande.": "في عام 800 يتوّج البابا شارلمان إمبراطورًا. يأتي مبعوث الإمبراطور، «ميسوس دومينيكوس»، لزيارة أرضك ويطرح عليك أسئلة.",
"Rinnovare il giuramento all'imperatore": "أن تجدد قسمك للإمبراطور",
"Giuri di nuovo, con la mano sul Vangelo. Costa una cena per tutti, ma il messo riparte soddisfatto.": "تقسم من جديد ويدك على الإنجيل. يكلّف عشاءً للجميع، لكن المبعوث يرحل راضيًا.",
"Prestigio": "هيبة",
"Mostrargli le tue difese": "أن تُريه دفاعاتك",
"Il messo non è molto colpito. Non hai molto da mostrare.": "لا يتأثر المبعوث كثيرًا. ليس لديك الكثير لتُريه.",
"Nascondere parte del raccolto": "أن تخفي جزءًا من الحصاد",
"Tieni più grano per te. Ma il messo è sospettoso.": "تحتفظ بقمح أكثر لنفسك. لكن المبعوث يشك.",
"Il messo ammira il castello. «Un territorio ben difeso è un territorio fedele», dice.": "يعجب المبعوث بالقلعة. ويقول: «الأرض المحمية جيدًا أرض وفية».",
"Il vassallo ambizioso": "التابع الطموح",
"Il tuo vassallo si è fatto costruire una torre e manda sempre meno grano. Conta il Favore del re.": "بنى تابعك لنفسه برجًا ويرسل قمحًا أقل فأقل. يهمّ رضا الملك.",
"La torre del vassallo è quasi finita. Se hai Favore del re 50 o più, il re ti sostiene e lui si piega.": "برج التابع شبه منتهٍ. إذا كان رضا الملك 50 أو أكثر، يدعمك الملك وينحني التابع.",
"Il tuo vassallo si è fatto costruire una torre e smette di mandarti il grano. Dice che è lui, ormai, a proteggere il villaggio.": "بنى تابعك لنفسه برجًا ويتوقف عن إرسال القمح إليك. ويقول إنه هو من يحمي القرية الآن.",
"Autorità": "سلطة",
"Richiamarlo all'ordine": "أن تستدعيه إلى الطاعة",
"Senza l'appoggio del re il vassallo non ti ascolta. I tuoi uomini si dividono.": "بدون دعم الملك لا يسمع لك التابع. ينقسم رجالك.",
"Rinnovare il patto con un dono": "أن تجدد العهد بهدية",
"Un dono e una nuova promessa. Il vassallo resta con te, per ora.": "هدية ووعد جديد. يبقى التابع معك، في الوقت الحالي.",
"Lasciar correre": "أن تترك الأمور",
"Il vassallo diventa indipendente. Un fedele in meno, un rivale in più.": "يصبح التابع مستقلًا. أتباع أقل، ومنافس أكثر.",
"Il re ti sostiene: il vassallo si piega. La tua autorità regge perché dietro di te c'è un potere più grande.": "يدعمك الملك: ينحني التابع. تصمد سلطتك لأن خلفك سلطة أكبر.",
"Un vicino ti prende un villaggio": "جار يأخذ منك قرية",
"Un signore del posto sta spostando i confini. Nessun fedele presidia le tue terre lontane.": "سيد من المنطقة يغيّر الحدود. لا يحرس أي تابع أراضيك البعيدة.",
"Ha pochi uomini, ma buoni. Con Sicurezza 50 o più riprendi il villaggio. Il re ti aiuta se hai Favore del re 50 o più.": "لديه رجال قليلون لكنهم جيدون. بأمان 50 أو أكثر تستعيد القرية. والملك يساعدك إذا كان رضا الملك 50 أو أكثر.",
"Un signore del posto occupa un villaggio sul tuo confine. Nessun fedele lo presidiava per te.": "سيد من المنطقة يحتل قرية على حدودك. لم يكن أي تابع يحرسها لك.",
"Riprenderlo con le armi": "أن تستعيدها بالسلاح",
"Non hai uomini a sufficienza. Perdi e il vicino si fa più forte.": "ليس لديك رجال كافون. تخسر ويقوى جارك.",
"Chiedere aiuto al re": "أن تطلب مساعدة الملك",
"Il re non ti aiuta: non gli sei abbastanza vicino.": "لا يساعدك الملك: لست قريبًا منه بما يكفي.",
"Rinuncia": "تنازل",
"Lasciarglielo": "أن تتركها له",
"Perdi terra e prestigio. I contadini dei villaggi vicini si chiedono se sei ancora capace di proteggerli.": "تخسر أرضًا وهيبة. ويتساءل الفلاحون في القرى المجاورة إن كنت ما زلت قادرًا على حمايتهم.",
"I tuoi uomini sono pronti. Riprendi il villaggio.": "رجالك مستعدون. تستعيد القرية.",
"Il re manda un messo e il vicino cede. Ma ora gli devi un favore.": "يرسل الملك رسولًا ويتراجع الجار. لكنك الآن مدين له بخدمة.",
"I nipoti di Carlo Magno": "أحفاد شارلمان",
"Dal nord arrivano notizie: l'impero è stato diviso tra tre fratelli, e tutti e tre chiedono fedeltà.": "تصل أخبار من الشمال: انقسمت الإمبراطورية بين ثلاثة إخوة، والثلاثة يطلبون الولاء.",
"Un messo ti porta la notizia: i nipoti di Carlo Magno si sono divisi l'impero in tre parti. Uno di loro, Lotario, regna anche sull'Italia. Devi decidere a chi giurare fedeltà. Ognuno dei tre re è lontano, e ognuno ti chiederà qualcosa.": "يحمل إليك رسول الخبر: أحفاد شارلمان اقتسموا الإمبراطورية إلى ثلاثة أجزاء. وأحدهم، لوثار، يحكم إيطاليا أيضًا. عليك أن تقرر لمن تُقسم بالولاء. كل واحد من الملوك الثلاثة بعيد، وكل واحد سيطلب منك شيئًا.",
"Giurare fedeltà a Lotario, il re dell'Italia": "أن تقسم الولاء للوثار، ملك إيطاليا",
"Lotario è il più vicino: ti riconosce e ti lascia governare in suo nome.": "لوثار هو الأقرب: يعترف بك ويتركك تحكم باسمه.",
"Mandare doni a tutti e tre": "أن ترسل هدايا للثلاثة",
"Costa caro, ma nessuno dei tre ti considera un nemico.": "يكلّفك كثيرًا، لكن لا أحد من الثلاثة يعتبرك عدوًا.",
"Non giurare a nessuno": "ألا تقسم لأحد",
"Sei libero, ma nessun re ti difenderà. I re litigano tra loro, ma i loro messi ricordano chi ha giurato.": "أنت حر، لكن لا ملك سيدافع عنك. الملوك يتنازعون فيما بينهم، لكن رسلهم يتذكرون من أقسم.",
"Il re chiede dei soldati": "الملك يطلب جنودًا",
"Il re prepara una campagna militare e chiederà uomini d'arme ai suoi fedeli. Le Guardie contano.": "يستعد الملك لحملة عسكرية وسيطلب رجال سلاح من أتباعه. يهمّ الحراس.",
"Un messo del re arriva a chiedere uomini d'arme per una campagna. Chi ha ricevuto terre in cambio di fedeltà deve aiutare con le armi quando il re lo chiede. È un dovere del vassallo.": "يصل رسول الملك ليطلب رجال سلاح لحملة. من نال أرضًا مقابل الولاء عليه أن يساعد بالسلاح عندما يطلب الملك. هذا واجب التابع.",
"Mandare i tuoi uomini": "أن ترسل رجالك",
"Mandi i tuoi uomini migliori. Tornano con prestigio e qualche bottino.": "ترسل أفضل رجالك. يعودون بالهيبة وببعض الغنائم.",
"Pagare una somma al posto dei soldati": "أن تدفع مبلغًا بدل الجنود",
"Il re accetta, ma si aspettava uomini, non monete.": "يقبل الملك، لكنه كان ينتظر رجالًا لا نقودًا.",
"Rifiutare: devi difendere la tua terra": "أن ترفض: عليك أن تدافع عن أرضك",
"Il re non è contento. Un fedele che non risponde alla chiamata non è un buon fedele.": "الملك غير راضٍ. والتابع الذي لا يلبي النداء ليس تابعًا جيدًا.",
"Hai pochi uomini: ne mandi quasi tutti e la tua zona resta scoperta.": "لديك رجال قليلون: ترسل تقريبًا كلهم وتبقى منطقتك مكشوفة.",
"Gli Ungari": "المجريون",
"Cavalieri velocissimi vengono dalle pianure dell'est e attaccano i villaggi del nord. Contano le Difese.": "فرسان سريعون جدًا يأتون من سهول الشرق ويهاجمون قرى الشمال. تهمّ الدفاعات.",
"Sono cavalieri veloci. Solo un castello di pietra (Difese 3) li ferma del tutto. Con una torre (Difese 2) salvi la gente ma non i campi.": "هم فرسان سريعون. قلعة من الحجر وحدها (الدفاعات 3) توقفهم تمامًا. وببرج (الدفاعات 2) تنقذ الناس لكن لا تنقذ الحقول.",
"Cavalieri velocissimi, venuti dalle pianure dell'Ungheria, attaccano il nord dell'Italia. Il re è lontano e non può aiutarti. Non esiste un esercito che ti difenda. Solo tu.": "فرسان سريعون جدًا، جاؤوا من سهول المجر، يهاجمون شمال إيطاليا. الملك بعيد ولا يستطيع مساعدتك. لا يوجد جيش يدافع عنك. أنت وحدك.",
"Chiudere tutti dentro il castello": "أن تُدخل الجميع داخل القلعة",
"Le difese sono troppo deboli. Gli Ungari entrano e portano via quasi tutto.": "الدفاعات ضعيفة جدًا. يدخل المجريون ويأخذون تقريبًا كل شيء.",
"Fuggire nei boschi con i contadini": "أن تهرب إلى الغابات مع الفلاحين",
"Vi salvate, ma i campi vengono bruciati.": "تنجون، لكن الحقول تُحرق.",
"Pagare un tributo agli Ungari": "أن تدفع جزية للمجريين",
"Pagando, gli Ungari passano oltre. Il grano che dai oggi è ciò che mancherà all'inverno.": "بعد أن تدفع، يمرّ المجريون. القمح الذي تعطيه اليوم هو ما سينقصك في الشتاء.",
"Mura, torri e fossato reggono. Gli Ungari bruciano qualche campo e se ne vanno. Il castello ti ha salvato la gente.": "الأسوار والأبراج والخندق تصمد. يحرق المجريون بعض الحقول ويرحلون. أنقذت القلعة أهلك.",
"La torre resiste, ma non c'è posto per tutti. Perdi parte del raccolto e qualche vita.": "يصمد البرج، لكن لا يتسع المكان للجميع. تخسر جزءًا من الحصاد وبعض الأرواح.",
"La terra per tuo figlio": "الأرض لابنك",
"Stai invecchiando e pensi a chi erediterà le tue terre. Contano il Favore del re e la tua forza.": "تتقدم في السن وتفكر فيمن سيرث أراضيك. يهمّ رضا الملك وقوتك.",
"Stai invecchiando e vuoi che le terre passino a tuo figlio. Un tempo erano un beneficio dato dal re a una sola persona. Ora i signori vogliono che diventino ereditarie.": "تتقدم في السن وتريد أن تنتقل الأراضي إلى ابنك. كانت في الماضي منحة من الملك لشخص واحد. والآن يريد السادة أن تصبح وراثية.",
"Chiedere al re di confermare l'eredità": "أن تطلب من الملك تثبيت الوراثة",
"Il re non si fida di te. Rimanda la decisione e il tuo posto è incerto.": "لا يثق بك الملك. يؤجل القرار ويصبح مكانك غير مضمون.",
"Dichiarare che è vostro e basta": "أن تعلن أنها لكم وكفى",
"Il re manda uomini per metterti in riga e tu non hai le forze per resistere.": "يرسل الملك رجالًا ليضعوك عند حدّك وليس لديك القوة لتقاوم.",
"Lasciare le cose come stanno": "أن تترك الأمور على حالها",
"Tuo figlio erediterà il tuo posto, o forse no. Nessuno lo sa.": "سيرث ابنك مكانك، أو ربما لا. لا أحد يعرف.",
"Nessuno ha la forza di contraddirti. Il re non è contento, ma accetta.": "لا أحد يملك القوة ليعارضك. الملك غير راضٍ، لكنه يقبل.",
"Il re conferma: il feudo è della tua famiglia. È uno dei passi che trasformano il feudo in una proprietà ereditaria.": "يثبّت الملك: الإقطاعية لعائلتك. هذه إحدى الخطوات التي تحوّل الإقطاعية إلى ملكية وراثية.",
"Troppe volte hai perso il controllo: carestie, saccheggi o rivolte. Senza un potere che tenga insieme le cose, ognuno pensa solo a sé. È ciò che temevano gli uomini del 476.": "فقدت السيطرة مرات كثيرة: مجاعات ونهب وثورات. وبدون سلطة تجمع الأمور، يفكر كل واحد في نفسه فقط. هذا ما كان يخشاه رجال عام 476.",
"Hai costruito una rete di fedeltà: al re da una parte, ai tuoi vassalli dall'altra. Il tuo potere dipende da legami personali, non da una legge scritta. Se un legame si spezza, la catena si indebolisce.": "بنيت شبكة من الولاءات: للملك من جهة ولتابعيك من جهة أخرى. تعتمد سلطتك على روابط شخصية لا على قانون مكتوب. وإن انقطعت رابطة ضعفت السلسلة.",
"Hai tenuto in vita il feudo in un'epoca difficile, senza eccellere in niente. Per molte famiglie, allora, bastava già questo.": "أبقيت الإقطاعية حية في زمن صعب، دون أن تتفوق في شيء. وبالنسبة لعائلات كثيرة كان ذلك يكفي في تلك الأيام.",
"La gente di qui si fida di te. Hai usato il potere per tenere insieme una comunità, aiutando i contadini e sostenendo la Chiesa. Nel mondo feudale era un modo di governare, ma non l'unico.": "أهل المكان يثقون بك. استخدمت السلطة لتجمع الناس في جماعة واحدة، فساعدت الفلاحين ودعمت الكنيسة. في العالم الإقطاعي كانت هذه طريقة للحكم، لكنها لم تكن الوحيدة.",
"Il tuo castello è il centro del mondo di chi vive intorno. Sei forte e rispettato, ma la tua forza viene dalla paura e dalle armi. Il tuo potere è legato a un luogo e a una famiglia, non a uno Stato.": "قلعتك هي مركز عالم من يعيش حولها. أنت قوي ومحترم، لكن قوتك تأتي من الخوف والسلاح. وسلطتك مرتبطة بمكان وعائلة، لا بدولة.",
"← Indietro": "→ رجوع",
"Punti": "النقاط",
"Docente": "المعلم",
"Un feudo dopo Roma": "إقطاعية بعد روما",
"Gioco di classe": "لعبة للصف",
"circa 45 minuti": "حوالي 45 دقيقة",
"Governa il tuo feudo": "احكم إقطاعيتك",
"Un evento": "حدث",
"Ogni capitolo succede qualcosa e scegli come rispondere.": "في كل فصل يحدث شيء وتختار كيف تتصرف.",
"Due ordini": "أمران",
"Poi tocchi la mappa per costruire e comandare.": "ثم تلمس الخريطة لتبني وتأمر.",
"Conta com'è il tuo feudo e quante domande indovini.": "تُحسب حالة إقطاعيتك وعدد الأسئلة التي تجيب عنها صحيحًا.",
"Il tuo nome": "اسمك",
"Inizia": "ابدأ",
"Prima c'è un tutorial di due minuti. Puoi saltarlo.": "قبل اللعبة هناك شرح قصير مدته دقيقتان. يمكنك تخطيه.",
"Come ti chiami?": "ما اسمك؟",
"verso Pavia": "نحو بافيا",
"verso Mediolanum": "نحو ميديولانوم",
"Tutorial": "الشرح",
"come si gioca": "كيف تلعب",
"Prova": "تجربة",
"Questa è la tua mappa": "هذه خريطتك",
"Al centro c'è la tua villa. A sinistra il villaggio, in basso i campi. In alto a destra la strada che porta a Pavia.": "في الوسط ضيعتك. على اليسار القرية، وفي الأسفل الحقول. وفي أعلى اليمين الطريق المؤدي إلى بافيا.",
"Le persone si muovono davvero: guardale. Ogni cosa che decidi cambia la mappa.": "الناس يتحركون فعلًا: راقبهم. كل قرار تتخذه يغيّر الخريطة.",
"Avanti": "التالي",
"Salta il tutorial": "تخطَّ الشرح",
"La villa": "الضيعة",
"Il villaggio": "القرية",
"I campi": "الحقول",
"Strada per Pavia": "طريق بافيا",
"Le quattro misure": "المقاييس الأربعة",
"Sotto la mappa vedi come sta il tuo feudo.": "تحت الخريطة ترى حال إقطاعيتك.",
"Il cibo. Senza grano la gente ha fame.": "الطعام. بدون قمح يجوع الناس.",
"Quanto sei protetto da bande e nemici.": "مدى حمايتك من العصابات والأعداء.",
"Quanto la gente è contenta e resta con te.": "مدى رضا الناس وبقائهم معك.",
"Compare più avanti, quando un re si accorge di te.": "يظهر لاحقًا، عندما ينتبه إليك ملك.",
"Se una misura scende a zero scatta una crisi: perdi punti e la partita si complica.": "إذا نزل أحد المقاييس إلى الصفر تقع أزمة: تخسر نقاطًا وتصبح اللعبة أصعب.",
"Come funziona un capitolo": "كيف يسير الفصل",
"Evento.": "الحدث.",
"Succede qualcosa. Leggi cosa è in gioco e scegli come rispondere.": "يحدث شيء. اقرأ ما هو على المحك واختر كيف تتصرف.",
"Ordini.": "الأوامر.",
"Hai due ordini per costruire, difendere o governare. Alcuni ordini compaiono solo quando servono.": "لديك أمران للبناء أو الدفاع أو الحكم. بعض الأوامر لا تظهر إلا عند الحاجة.",
"Fine capitolo.": "نهاية الفصل.",
"Raccolto e scorte cambiano le misure.": "الحصاد والمؤن يغيّران المقاييس.",
"Alla fine di ogni capitolo c'è una domanda: vale 50 punti.": "في نهاية كل فصل يوجد سؤال: قيمته 50 نقطة.",
"Hai sbagliato? In alto c'è il pulsante «← Indietro». Annulla l'ultima mossa. Cambiare la risposta a un evento già deciso costa 10 punti.": "أخطأت؟ في الأعلى زر «رجوع». يلغي آخر حركة. وتغيير الجواب عن حدث قررته يكلّف 10 نقاط.",
"Prova un capitolo": "جرّب فصلًا",
"l'evento": "الحدث",
"Questo è un evento di tipo «Richiesta». Sotto il testo vedi cosa è in gioco. Ogni risposta ha un'etichetta che dice che genere di scelta è. Sceglierne una: è solo una prova.": "هذا حدث من نوع «طلب». تحت النص ترى ما هو على المحك. وكل جواب له وصف يبيّن نوع الاختيار. اختر واحدًا: هذه مجرد تجربة.",
"prova": "تجربة",
"In gioco": "على المحك",
"Come rispondi?": "كيف ترد؟",
"la conseguenza": "النتيجة",
"Leggi cosa è successo e perché. In alto le misure sono cambiate. Poi vai agli ordini.": "اقرأ ما حدث ولماذا. المقاييس في الأعلى تغيّرت. ثم انتقل إلى الأوامر.",
"Hai scelto": "اخترت",
"Dai i tuoi ordini": "أعطِ أوامرك",
"gli ordini": "الأوامر",
"Scegli due ordini: tocca un punto lampeggiante sulla mappa o una voce della lista. Di ognuno vedi cosa costa e cosa ottieni. Poi conferma. Nella partita vera dovrai capire da solo quali ordini servono.": "اختر أمرين: المس نقطة تومض على الخريطة أو بندًا من القائمة. ترى ما يكلّفه كل أمر وما تكسبه منه. ثم أكّد. في اللعبة الحقيقية عليك أن تفهم بنفسك أي الأوامر تلزم.",
"Che ordini dai al tuo feudo?": "ما الأوامر التي تعطيها لإقطاعيتك؟",
"Ordini": "الأوامر",
"Cosa è successo": "ماذا حدث",
"Hai scelto:": "اخترت:",
"Voci dal villaggio": "أخبار من القرية",
"Conterà": "سيهمّ",
"Chiudi il capitolo senza altri ordini": "أنهِ الفصل دون أوامر أخرى",

/* ---------- azioni ---------- */
function clearFx() { ents.length = 0; fires.length = 0; floats.length = 0; timers.length = 0; sparks.length = 0; smoke.length = 0; }
function pushHist() { if (!st) return; hist.push(JSON.stringify(st)); if (hist.length > 40) hist.shift(); }
const canBack = () => !!(st && hist.length && !ui.board && st.phase !== 'end' && st.phase !== 'quizfb');
function back() {
  if (!canBack()) return;
  const cur = st, prev = JSON.parse(hist.pop());
  prev.undos = (cur.undos || 0) + (cur.phase === 'result' && !cur.tut ? 1 : 0);
  st = prev; ui.sel = []; clearFx(); render();
  if (st.phase === 'event') enterAnim();
}
function start() {
  const name = ($('nome') && $('nome').value.trim()) || 'Studente';
  st = newState(name); st.tut = true; st.phase = 'tut'; st.tutStep = 0;
  ui.sel = []; ui.sent = null; hist.length = 0; clearFx(); wipe(); render();
  openPrologue();
}
function beginGame() {
  const name = st.name; st = newState(name); ui.sel = []; ui.sent = null; hist.length = 0; clearFx(); wipe(); render();
}
function tutNext() {
  pushHist(); st.tutStep++;
  if (st.tutStep >= 3) { st.phase = 'event'; beginTurn(st); }
  render();
}
function choose(i) {
  pushHist();
  const res = doChoice(st, i);
  render(); playAnim(res.anim);
}
function confirmOrder() {
  const L = ORDERS(st), list = ui.sel.map(id => L.find(x => x.id === id)).filter(Boolean).slice(0, st.ap);
  if (!list.length) return;
  pushHist();
  const logs = [];
  list.forEach((o, n) => {
    const before = snap(st); applyD(st, o.d);
    const chips = diffChips(before, snap(st)), t = tileFor(o.id) || FX_TILE[o.id] || [3, 3];
    const px = t[0] + .5, py = t[1] + .35, dl = n * .8;
    if (o.id === 'terre') appear['f' + (st.terre - 1)] = 0;
    if (o.id === 'esplora') playAnim({ k: 'messenger' });
    if (o.id === 'ricostruisci') fires.length = 0;
    chips.forEach((c, i) => say(`${c.v > 0 ? '+' : '−'}${Math.abs(c.v)} ${LABEL[c.k]}`, px, py, c.v > 0 ? '#1c1416' : '#c8102e', dl + i * .35));
    later(dl, () => burst(px, py + .2, 12));
    if (o.id === 'king' || o.id === 'ally') playAnim({ k: 'messenger' });
    st.orders.push(o.title); st.ap--; logs.push({ title: o.title, chips, msg: ORDER_MSG[o.id] || '' });
  });
  st.last = logs; ui.sel = []; render();
}
function endTurn() {
  pushHist();
  const before = snap(st), lines = tick(st), crisis = checkCrisis(st);
  st.log.push({ t: st.turn, ev: st.pending ? st.pending.ev : '', choice: st.pending ? st.pending.choice : '', orders: st.orders.slice() });
  const aut = st.turn % 2 === 1;
  if (aut) { FIELDS_BASE.concat(FIELD_SLOTS.slice(0, st.terre)).forEach(f => say('+', f[0] + .5, f[1] + .4, '#1c1416', Math.random() * .6)); }
  st.view = { lines, chips: diffChips(before, snap(st)), crisis }; st.phase = 'tick'; st.last = null; st.recap = null; ui.sel = []; render();
}
function nextStep() {
  pushHist();
  if (st.tut) { st.phase = 'tut'; st.tutStep = 3; render(); return; }
  if (st.turn % 2 === 1) { st.phase = 'quiz'; render(); return; }
  st.turn++; beginTurn(st); st.phase = 'event'; render(); enterAnim();
}
function enterAnim() { const ev = eventFor(st); if (ev.enter) playAnim(ev.enter); }
function answer(i) {
  const q = CH[chapterOf(st.turn)].quiz, right = i === q.ok;
  if (right) st.quizPts += 50;
  st.hint = false; hist.length = 0;
  st.view = { pick: i, right }; st.phase = 'quizfb'; render();
}
function afterQuiz() {
  hist.length = 0;
  if (st.turn >= TURNS - 1) { st.phase = 'end'; wipe(); finish(); render(); return; }
  st.turn++; beginTurn(st); st.phase = 'chapter'; render();
}
async function finish() {
  ui.sent = ui.db ? 'wait' : null;
  if (!ui.db) return;
  const tok = parseToken(makeToken(st)); if (!tok) { ui.sent = null; return; }
  try { await ui.db.collection('scores').doc(tok.id).set({ name: tok.name, feudo: tok.feudo, quiz: tok.quiz, total: tok.total, crisi: tok.crisi, e: tok.e, at: Date.now() }); ui.sent = true; if (st && st.phase === 'end') render(); } catch (e) { ui.sent = null; if (st && st.phase === 'end') render(); }
}
async function copyText(id) {
  const el = $(id); const t = el.value !== undefined && el.tagName === 'TEXTAREA' ? el.value : el.textContent;
  try { await navigator.clipboard.writeText(t); $('copied').textContent = tr('Copiato.'); }
  catch (e) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copied').textContent = tr('Seleziona e copia il link.'); }
}
async function addTokens(text) {
  const found = (text.match(TOKEN_RE) || []), seen = new Set(); let ok = 0, bad = 0;
  for (const t of found) {
    const r = parseToken(t); if (!r) { bad++; continue; } if (seen.has(r.id)) continue; seen.add(r.id);
    try { await ui.db.collection('scores').doc(r.id).set({ name: r.name, feudo: r.feudo, quiz: r.quiz, total: r.total, crisi: r.crisi, e: r.e, at: Date.now() }); ok++; } catch (e) { bad++; }
  }
  ui.boardMsg = found.length ? `${ok} aggiunti${bad ? `, ${bad} non validi` : ''}.` : 'Non ho trovato nessun codice valido.';
  render();
}

    <line x1="388" y1="86" x2="388" y2="150" stroke="${PI_INK}" stroke-width="3.5"/><polygon points="388,80 383,94 393,94" fill="${PI_INK}"/>

}
/* 6 · la città piena */
function pS6() {
  let cols = '', stalls = '', crowd = '';
  for (let i = 0; i < 8; i++) cols += `<rect x="${58 + i * 48}" y="64" width="12" height="96" fill="#fff" stroke="${PI_INK}" stroke-width="2.5"/>`;
  [24, 136, 248, 360].forEach((x, k) => {
    let aw = ''; for (let i = 0; i < 6; i++) aw += `<rect x="${x + i * 16}" y="150" width="16" height="22" fill="${i % 2 ? '#fff' : PI_RED}" stroke="${PI_INK}" stroke-width="2"/>`;
    const goods = [0, 1, 2, 3, 4].map(g => `<circle cx="${x + 14 + g * 17}" cy="178" r="5.5" fill="${(g + k) % 2 ? PI_RED : '#e5b84a'}" stroke="${PI_INK}" stroke-width="2"/>`).join('');
    stalls += `<rect x="${x + 4}" y="172" width="88" height="26" fill="#d9b77a" stroke="${PI_INK}" stroke-width="3"/>${goods}${aw}`;
  });
  const xs = [34, 74, 112, 150, 192, 228, 268, 306, 342, 378, 416, 448], cs = [PI_RED, PI_INK, '#e5b84a', '#7a6a62'];
  xs.forEach((x, i) => {
    const y = 222 + (i * 7) % 26, bob = pBob(2.4 + (i % 3), `${(.5 + (i % 4) * .13).toFixed(2)}s`, -i * .17);
    const walk = i % 3 === 0 ? `<g>${pMove(`0 0;${i % 2 ? -26 : 26} 0;0 0`, `${6 + i % 4}s`, 'repeatCount="indefinite"')}` : '<g>';
    crowd += walk + pFig(x, y, cs[i % 4], 1.15 + (y - 222) / 100, bob) + '</g>';
  });
  return pSvg(`<rect width="480" height="270" fill="${PI_SKY}"/>
    <rect x="40" y="62" width="400" height="100" fill="#f3ece0" stroke="${PI_INK}" stroke-width="3"/><polygon points="28,62 240,18 452,62" fill="${PI_RED}" stroke="${PI_INK}" stroke-width="3" stroke-linejoin="round"/>${cols}
    <rect x="0" y="198" width="480" height="72" fill="${PI_GROUND}"/><line x1="0" y1="198" x2="480" y2="198" stroke="${PI_INK}" stroke-width="3"/>${stalls}${crowd}`);
}
/* 7 · il carro non arriva */
function pS7() {
  let birds = ''; [[60, 0], [88, -2.6], [44, -5]].forEach(([y, b]) => birds += `<g><path d="M0 0 q6 -7 12 0 q6 -7 12 0" fill="none" stroke="${PI_INK}" stroke-width="2.5" stroke-linecap="round"/>${pMove(`-30 ${y};510 ${y - 14}`, '9s', `repeatCount="indefinite" begin="${b}s"`)}</g>`);
  return pSvg(`<rect width="480" height="270" fill="${PI_SKY}"/>
    <path d="M0 150 Q100 120 200 146 T400 140 T480 138 V270 H0Z" fill="#ebe3d0" stroke="${PI_INK}" stroke-width="3"/>
    <rect x="0" y="170" width="480" height="56" fill="${PI_ROAD}"/><line x1="0" y1="170" x2="480" y2="170" stroke="${PI_INK}" stroke-width="3"/><line x1="0" y1="226" x2="480" y2="226" stroke="${PI_INK}" stroke-width="3"/>
    <line x1="0" y1="198" x2="480" y2="198" stroke="#b79a68" stroke-width="3" stroke-dasharray="14 12"/>
    <rect x="70" y="162" width="10" height="17" rx="2" fill="${PI_STONE}" stroke="${PI_INK}" stroke-width="2"/><rect x="72" y="166" width="6" height="2.5" fill="${PI_RED}"/>
    <g transform="translate(200 206)"><circle r="14" fill="#fff" stroke="${PI_INK}" stroke-width="3" transform="rotate(20)"/><line x1="-14" y1="0" x2="14" y2="0" stroke="${PI_INK}" stroke-width="2" transform="rotate(20)"/><line x1="0" y1="-14" x2="0" y2="14" stroke="${PI_INK}" stroke-width="2" transform="rotate(20)"/></g>
    <ellipse cx="238" cy="212" rx="12" ry="9" fill="${PI_GOLD}" stroke="${PI_INK}" stroke-width="2.5"/><circle cx="256" cy="219" r="2.5" fill="${PI_GRAIN}" stroke="${PI_INK}" stroke-width="1"/><circle cx="262" cy="214" r="2.5" fill="${PI_GRAIN}" stroke="${PI_INK}" stroke-width="1"/>
    <rect width="480" height="270" fill="${PI_INK}" opacity="0">${pAnim('opacity', 0, .42, '4s', 'fill="freeze"')}</rect>
    ${birds}
    <g>${pMove('530 190;330 190', '3s', 'begin=".4s" fill="freeze"')}${pFig(0, 0, PI_RED, 1.4, pBob(2.2, '.28s'))}</g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur=".3s" fill="freeze"/><circle cx="352" cy="132" r="17" fill="${PI_RED}" stroke="#fff" stroke-width="2.5"/><text x="352" y="140" text-anchor="middle" font-size="24" fill="#fff" font-family="'Alfa Slab One', Georgia, serif">!</text></g>`);
}
/* 8 · 476 d.C. */
function pS8() {
  let em = ''; for (let i = 0; i < 16; i++) em += `<rect x="${12 + i * 29}" width="${3 + i % 3}" height="${3 + i % 3}" fill="${i % 3 ? PI_RED : '#fff'}" opacity=".85">${pAnim('y', 285, -10, `${4 + i % 5}s`, `repeatCount="indefinite" begin="${-i * .7}s"`)}</rect>`;
  const yr = LANG === 'ar' ? tr('476 d.C.') : '476 d.C.';
  return pSvg(`<rect width="480" height="270" fill="${PI_INK}"/>${em}
    <text x="240" y="152" text-anchor="middle" font-size="${LANG === 'ar' ? 84 : 76}" fill="#fff" font-family="${LANG === 'ar' ? "'Cairo', 'Noto Sans Arabic', sans-serif" : "'Alfa Slab One', Georgia, serif"}" font-weight="800" opacity="0">${pAnim('opacity', 0, 1, '1.4s', 'begin=".3s" fill="freeze"')}${yr}</text>
    <polyline points="246,0 232,52 252,96 230,150 250,200 236,270" fill="none" stroke="${PI_RED}" stroke-width="4" stroke-linejoin="round" stroke-dasharray="330" stroke-dashoffset="330"><animate attributeName="stroke-dashoffset" from="330" to="0" begin="1.9s" dur="1.1s" fill="freeze"/></polyline>`);
}
const PRO = [
  { t: '400 d.C.', x: ['Una villa in Italia. Il mondo funziona.'], a: pS1 },
  { x: ['Le strade romane sono sicure: un carro di grano parte all\'alba e arriva in città senza scorta.'], a: pS2 },
  { x: ['Una sola moneta vale da un capo all\'altro dell\'Impero.'], a: pS3 },
  { x: ['Se un vicino ti ruba un campo, c\'è un giudice che ti ascolta.'], a: pS4 },
  { x: ['Paghi le tasse. In cambio hai strade, acquedotti e soldati ai confini.'], a: pS5 },
  { x: ['Le città sono piene di gente, di mercati, di cose da comprare.'], a: pS6 },
  { x: ['Ma un giorno il carro non arriva.', '«Le strade non sono più sicure», dice il messo.'], a: pS7 },
  { x: ['Cade l\'Impero romano d\'Occidente.'], a: pS8 }
];
let proI = 0, proOpen = false;
function proRender() {
  const el = $('prologue'), sc = PRO[proI], last = proI === PRO.length - 1, ar = LANG === 'ar', L = s => ar ? tr(s) : s;
  const num = ar ? `⁦${proI + 1}/${PRO.length}⁩` : `${proI + 1}/${PRO.length}`;
  el.lang = LANG;
  el.innerHTML = `<div class="pro-card" dir="${ar ? 'rtl' : 'ltr'}">
    <div class="pro-art pro-in">${sc.a()}</div>
    <div class="pro-body">
      <div class="pro-top"><div class="eyebrow">${L('Prologo')} · ${num}</div><button class="pill" data-notr data-pro="lang">${ar ? 'Italiano' : 'العربية'}</button></div>
      ${sc.t ? `<h2 class="pro-title">${L(sc.t)}</h2>` : ''}
      ${sc.x.map((s, i) => `<p class="pro-text" style="animation-delay:${(.5 + i * 2.4).toFixed(1)}s">${L(s)}</p>`).join('')}
      <div class="pro-dots">${PRO.map((_, i) => `<i class="${i < proI ? 'done' : i === proI ? 'now' : ''}"></i>`).join('')}</div>
      <div class="row"><button class="btn" data-pro="next">${L(last ? 'Vai al tutorial' : 'Avanti')}</button>${last ? '' : `<button class="btn ghost" data-pro="skip">${L('Salta il prologo')}</button>`}</div>
    </div></div>`;
  const svg = el.querySelector('svg');
  if (svg && svg.unpauseAnimations) { try { svg.unpauseAnimations(); } catch (e) {} }
  const nb = el.querySelector('[data-pro=next]'); if (nb && nb.focus) nb.focus({ preventScroll: true });
  el.scrollTop = 0;
}
function openPrologue() { proI = 0; proOpen = true; $('prologue').hidden = false; document.body.style.overflow = 'hidden'; proRender(); }
function closePrologue() { proOpen = false; $('prologue').hidden = true; document.body.style.overflow = ''; window.scrollTo(0, 0); render(); }
function proNext() { if (proI >= PRO.length - 1) closePrologue(); else { proI++; proRender(); } }
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-pro]'); if (!b || !proOpen) return; const a = b.dataset.pro;
  if (a === 'next') proNext(); else if (a === 'skip') closePrologue(); else if (a === 'lang') toggleLang();
});
document.addEventListener('keydown', e => {
  if (!proOpen || e.ctrlKey || e.metaKey) return;
  if (e.key === 'Escape') closePrologue(); else if (e.key === 'ArrowRight') proNext();
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a === 'start') start();
  else if (a === 'continue') { st = saved; saved = null; render(); }
  else if (a === 'go-event') { pushHist(); st.phase = 'event'; render(); enterAnim(); }
  else if (a === 'tut-next') tutNext();
  else if (a === 'tut-skip' || a === 'tut-done') beginGame();
  else if (a === 'choose') choose(+b.dataset.i);
  else if (a === 'go-map') { pushHist(); st.phase = 'map'; ui.sel = []; render(); }
  else if (a === 'select') { togglePick(b.dataset.id); }
  else if (a === 'cancel') { ui.sel = []; render(); }
  else if (a === 'confirm') confirmOrder();
  else if (a === 'end-turn') endTurn();
  else if (a === 'next') nextStep();
  else if (a === 'answer') answer(+b.dataset.i);
  else if (a === 'after-quiz') afterQuiz();
  else if (a === 'copy') copyText(b.dataset.t);
  else if (a === 'restart') { st = null; ui.sent = null; ui.board = false; hist.length = 0; render(); }
  else if (a === 'close-board') { ui.board = false; ui.pwErr = false; render(); }
  else if (a === 'unlock') unlock();
  else if (a === 'add-tokens') addTokens($('paste').value);
  else if (a === 'winner') showWinner();
  else if (a === 'close-winner') $('winner').hidden = true;
  else if (a === 'clear') {
    if (SHEET_URL) { ui.boardMsg = 'Per azzerare la classifica cancella le righe nel Foglio Google «Classifica Feudo».'; render(); }
    else if (!ui.clearArm) { ui.clearArm = true; render(); setTimeout(() => { ui.clearArm = false; if (ui.board) render(); }, 4000); }
    else { ui.clearArm = false; for (const r of (ui.rows || [])) { try { await ui.db.collection('scores').doc(r.id).delete(); } catch (e) {} } ui.boardMsg = 'Classifica azzerata.'; render(); }
  }
});
function unlock() {
  const v = $('pw') ? $('pw').value : '';
  if (fnv(v + SALT) === PW_HASH) { ui.unlocked = true; ui.pwErr = false; try { sessionStorage.setItem('feudo-doc', '1'); } catch (e) {} }
  else ui.pwErr = true;
  render();
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'pw') unlock(); });
function togglePick(id) {
  const i = ui.sel.indexOf(id);
  if (i >= 0) ui.sel.splice(i, 1); else { ui.sel.push(id); if (ui.sel.length > st.ap) ui.sel.shift(); }
  render();
  if (ui.sel.length) { const sc = document.querySelector('.sel-card'); if (sc && sc.scrollIntoView) sc.scrollIntoView({ block: 'nearest', behavior: 'auto' }); }
}
$('btnBoard').addEventListener('click', () => { ui.board = true; render(); });
$('btnBack').addEventListener('click', back);
$('btnLang').addEventListener('click', toggleLang);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.ctrlKey || e.metaKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 3) { const b = document.querySelectorAll('.opt[data-act]')[n - 1]; if (b) b.click(); }
});

/* ---------- classifica su Foglio Google (stessa interfaccia del db condiviso) ---------- */
function makeSheetDb(url) {
  const subs = []; let timer = null, last = [];
  const emit = rows => subs.forEach(f => f({ docs: rows.map(r => ({ id: r.id, data: () => r })) }));
  async function poll() {
    try {
      const r = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now()), j = await r.json();
      if (!Array.isArray(j)) return;
      last = j.map(x => ({ id: String(x.id), name: String(x.name), feudo: +x.feudo, quiz: +x.quiz, total: +x.total, crisi: +x.crisi, e: Math.max(0, ENDINGS.indexOf(x.finale)), at: 0 }));
      emit(last);
    } catch (e) {}
  }
  return {
    poll,
    collection: () => ({
      doc: id => ({
        set: async d => {
          await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ id, name: d.name, feudo: d.feudo, quiz: d.quiz, total: d.total, crisi: d.crisi, finale: ENDINGS[d.e] || '' }) });
          last = last.filter(x => x.id !== id).concat([Object.assign({ id }, d)]); emit(last);
        },
        delete: async () => {}
      }),
      onSnapshot: f => {
        subs.push(f); poll();
        if (!timer) timer = setInterval(() => { if (!document.hidden && (ui.board || (st && st.phase === 'end'))) poll(); }, 10000);
        return () => {};
      }
    })
  };
}

/* ---------- capacità: classifica condivisa (db) e docente (user) ---------- */
async function initCaps() {
  if (SHEET_URL) {
    ui.db = makeSheetDb(SHEET_URL);
    ui.db.collection('scores').onSnapshot(snap => { ui.rows = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); if (ui.board || (st && st.phase === 'end')) { const pa = document.activeElement; if (!(pa && (pa.tagName === 'TEXTAREA' || pa.tagName === 'INPUT'))) render(); } });
    render(); return;
  }
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    ui.isOwner = user ? await user.isOwner() : false;
    if (db) {
      ui.db = db;
      db.collection('scores').onSnapshot(snap => { ui.rows = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); if (ui.board || (st && st.phase === 'end')) { const pa = document.activeElement; if (!(pa && (pa.tagName === 'TEXTAREA' || pa.tagName === 'INPUT'))) render(); } }, () => {});
    }
    await handleHash();
    window.addEventListener('hashchange', handleHash);
    render();
  } catch (e) {}
}
async function handleHash() {
  if (!ui.isOwner || !ui.db) return;
  const m = (location.hash || '').match(TOKEN_RE); if (!m) return;
  ui.board = true; await addTokens(m.join(' '));
}

try { ui.unlocked = sessionStorage.getItem('feudo-doc') === '1'; } catch (e) {}
saved = load();
st = null;
render();
initCaps();
window.__game = { get st() { return st; }, get ui() { return ui; }, hist, back, ents, fires, playAnim };
</script>
